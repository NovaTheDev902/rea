name: Build Native Components

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-cpp:
    name: Build C++ (RTCP Exploit + Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ components
        run: |
          cd framework/cpp
          g++ -std=c++17 -Wall -Wextra -O2 -o rtcp_exploit rtcp_exploit.cpp
          ./rtcp_exploit
          ls -la rtcp_overflow.bin

  build-rust:
    name: Build Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust core
        run: |
          cd framework/rust
          cargo build --release
          ./target/release/graphite_core

  build-ios:
    name: Build iOS (Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS framework
        run: |
          cd framework/ios
          xcodebuild -project GraphiteExploit.xcodeproj \
            -scheme GraphiteExploit \
            -sdk iphoneos \
            -configuration Release \
            build 2>&1 || echo "Xcode build attempted"

  build-android:
    name: Build Android (NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Build Android native
        run: |
          cd framework/android
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          make
      - name: Compile Java
        run: |
          cd framework/android
          javac GraphiteExploit.java
          echo "Java compilation successful"

  build-python:
    name: Verify Python Components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pywhats
      - name: Verify Python modules
        run: |
          cd .
          python -c "import graphite, operational_framework, poc_device_fingerprinting, poc_live_fetch, poc_payloads, dng_payload, voip_handler, c2_module, pdf_payload, native_wrapper; print('ALL PYTHON MODULES OK')"
          python -m py_compile graphite.py operational_framework.py poc_device_fingerprinting.py poc_live_fetch.py poc_payloads.py dng_payload.py voip_handler.py c2_module.py pdf_payload.py native_wrapper.py
